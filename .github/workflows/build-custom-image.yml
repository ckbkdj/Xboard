name: Build Custom Xboard Image

on:
  push:
    branches:
      - custom-subscribe
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "ci-failures/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional immutable tag, for example custom-v1.0.0"
        required: false
        default: ""
        type: string

concurrency:
  group: xboard-custom-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ckbkdj/xboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: custom-subscribe
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: vars
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          short_sha="${GITHUB_SHA::12}"

          tags="${image}:custom-latest"
          tags+=$'\n'"${image}:custom-${short_sha}"

          if [[ -n "${VERSION_INPUT}" ]]; then
            if [[ ! "${VERSION_INPUT}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "Invalid version tag: ${VERSION_INPUT}" >&2
              exit 1
            fi
            tags+=$'\n'"${image}:${VERSION_INPUT}"
          fi

          printf '%s\n' "${tags}" > image-tags.txt
          {
            echo 'tags<<EOF'
            echo "${tags}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        shell: bash
        run: |
          set +e
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && tag_args+=(--tag "${tag}")
          done < image-tags.txt

          status=1
          for attempt in 1 2; do
            echo "===== Docker build attempt ${attempt}/2 =====" | tee -a build.log
            docker buildx build \
              --file ./Dockerfile.custom \
              --platform linux/amd64 \
              --pull \
              --push \
              --provenance=false \
              --progress=plain \
              --cache-from type=gha,scope=xboard-custom-overlay \
              --cache-to type=gha,mode=max,scope=xboard-custom-overlay \
              "${tag_args[@]}" \
              . 2>&1 | tee -a build.log
            status=${PIPESTATUS[0]}
            [[ ${status} -eq 0 ]] && break
            sleep 10
          done

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload failed build log
        if: steps.build.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: xboard-build-failure-${{ github.run_id }}
          path: build.log
          if-no-files-found: error
          retention-days: 7

      - name: Persist failure diagnostics
        if: steps.build.outputs.status != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ci-failures
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            tail -n 300 build.log
          } > ci-failures/latest.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-failures/latest.log
          git commit -m "ci: save Docker build failure log [skip ci]"
          git push origin HEAD:custom-subscribe

          {
            echo "## Automatic Docker build failure"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Log: \`ci-failures/latest.log\`"
            echo
            echo "### Last 220 log lines"
            echo '```text'
            tail -n 220 build.log
            echo '```'
          } > failure.md

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Docker build failed: ${GITHUB_SHA::12}" \
            --body-file failure.md || true

          exit 1

      - name: Write build summary
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          {
            echo '## Xboard image published'
            echo
            echo '```text'
            cat image-tags.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
